<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosimodule - Golden Ternary Flat Fold</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050811; color: #e2e8f0; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; max-width: 320px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h2>Mosimodule</h2>
    <p>Golden Ternary Flat Fold Visualizer</p>
    <p>Orbit / touch to explore Fibonacci-inspired crease geometry (sunflower, pinecone, ocean spray, golden ratio).</p>
    <p>Pure Three.js · No secrets · Client-side only</p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.enableZoom = true;

    // Lights
    const ambient = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Golden ratio
    const PHI = (1 + Math.sqrt(5)) / 2;

    // Fibonacci spiral points (sunflower / pinecone style)
    const points = [];
    const n = 300;
    for (let i = 0; i < n; i++) {
      const theta = i * Math.PI * 2 / PHI; // golden angle
      const r = Math.sqrt(i) * 0.15;
      points.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
    }
    const spiralGeom = new THREE.BufferGeometry().setFromPoints(points);
    const spiralMat = new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.08 });
    const spiral = new THREE.Points(spiralGeom, spiralMat);
    scene.add(spiral);

    // Crease pattern lines (golden ternary inspired)
    const lineMat = new THREE.LineBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.6 });
    for (let k = 1; k <= 8; k++) {
      const radius = k * 0.4;
      const segments = 3 + k % 3; // ternary feel
      const pts = [];
      for (let j = 0; j <= segments; j++) {
        const a = (j / segments) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * radius, 0.01, Math.sin(a) * radius));
      }
      const geom = new THREE.BufferGeometry().setFromPoints(pts);
      scene.add(new THREE.LineLoop(geom, lineMat));
    }

    // Central "black hole" torus / singularity
    const torusGeom = new THREE.TorusGeometry(0.6, 0.08, 16, 100);
    const torusMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x064e3b, metalness: 0.7, roughness: 0.3 });
    const torus = new THREE.Mesh(torusGeom, torusMat);
    torus.rotation.x = Math.PI / 2;
    scene.add(torus);

    // Ocean spray particles
    const sprayCount = 200;
    const sprayGeom = new THREE.BufferGeometry();
    const sprayPos = new Float32Array(sprayCount * 3);
    for (let i = 0; i < sprayCount; i++) {
      sprayPos[i*3] = (Math.random() - 0.5) * 8;
      sprayPos[i*3+1] = Math.random() * 2;
      sprayPos[i*3+2] = (Math.random() - 0.5) * 8;
    }
    sprayGeom.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
    const sprayMat = new THREE.PointsMaterial({ color: 0x93c5fd, size: 0.05, transparent: true, opacity: 0.7 });
    const spray = new THREE.Points(sprayGeom, sprayMat);
    scene.add(spray);

    // Ground plane
    const planeGeom = new THREE.PlaneGeometry(20, 20);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x111827, side: THREE.DoubleSide });
    const plane = new THREE.Mesh(planeGeom, planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = -0.1;
    scene.add(plane);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      torus.rotation.z += 0.005;
      spiral.rotation.y += 0.002;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Local user id (no server, no secrets)
    const userId = crypto.randomUUID();
    console.log('Local session id:', userId);
  </script>
</body>
</html>
